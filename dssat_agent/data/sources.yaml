# =============================================================================
# Reference rasters — static categorical/scalar lookups for the wizard's
# in-situ data step. Loaded by dssat_agent/startup/reference_rasters.py.
#
# Each entry produces:
#   - One PostGIS table per raster (all bands intact, queried via
#     data_agent.services.sample_raster_at_point()).
#   - One RasterDataset row keyed by `name` (used as dataset_subtype).
#   - Optionally: SoilTypeRasterLegend rows from `legend.file`.
#   - Optionally: StoredSoilProfile rows seeded from `soil_profiles_file`.
#
# All three loads are independently idempotent by SHA-256 file hash.
# =============================================================================

reference_rasters:
  - name: dssat_soil_lookup_v1
    dataset_name: "Southeast USA Soil Profiles"
    file: reference_rasters/soil_types.tif
    dataset_type: static
    temporal_resolution: static
    spatial_resolution: "0.047deg"
    domain: soil
    purpose: in_situ_soil_lookup
    value_type: categorical
    band_meanings:
      1: dominant
      2: second_dominant
      3: third_dominant
    variables:
      dominant:
        display_name: "Dominant Soil Type"
        variable_type: categorical
        has_legend: true
      second_dominant:
        display_name: "2nd Dominant Soil"
        variable_type: categorical
        has_legend: true
      third_dominant:
        display_name: "3rd Dominant Soil"
        variable_type: categorical
        has_legend: true
    variable_display_names:
      dominant: "Dominant Soil Type"
      second_dominant: "2nd Dominant Soil"
      third_dominant: "3rd Dominant Soil"
    no_data_value: 0
    coverage_extent:
      type: bbox
      min_lat: 24.84
      max_lat: 35.27
      min_lon: -88.52
      max_lon: -78.47
    subroutines:
      reference_lookup:
        table_name: dataagent.dssat_soil_lookup_v1
    legend:
      type: csv
      file: reference_rasters/soil_types_legend.csv
      value_column: band_value
      key_column: soil_code
      label_column: description
    # SE-US SSURGO soil profiles that the legend's soil_codes reference.
    # Seeded into StoredSoilProfile alongside raster registration so the
    # legend resolves to real profiles that simulations can run with.
    soil_profiles_file: reference_rasters/se_us_ssurgo.sol

  - name: dssat_planting_date_lookup_v1
    dataset_name: "Southeast USA Maize Planting Dates"
    file: reference_rasters/PlantingDateV2.tif
    dataset_type: static
    temporal_resolution: static
    spatial_resolution: "0.047deg"
    domain: planting
    purpose: in_situ_planting_date
    value_type: scalar
    units: julian_day
    band_meanings:
      1: typical_planting_julian_day
    variables:
      typical_planting_julian_day:
        display_name: "Typical Planting Day (Julian)"
        variable_type: numeric
        color_map:
          ramp: [[90,50,150,50],[110,150,255,50],[130,255,200,50]]
          chart_color: "rgba(34,197,94,0.9)"
          label: "Planting Day (Julian)"
    variable_display_names:
      typical_planting_julian_day: "Typical Planting Day (Julian)"
    no_data_value: -999
    coverage_extent:
      type: bbox
      min_lat: 24.82
      max_lat: 35.25
      min_lon: -88.50
      max_lon: -78.44
    subroutines:
      reference_lookup:
        table_name: dataagent.dssat_planting_date_lookup_v1

  # ---------------------------------------------------------------------------
  # SRTM elevation (static, SE-US clip). Used for the wizard's
  # "Auto-fill elevation" button. Matches the BBOX of the existing in-house
  # in-situ rasters above so the entire wizard flow has consistent coverage.
  #
  # First-boot ingest is automatic via the ``auto_download`` block:
  # ``dssat_agent/startup/reference_rasters.py`` fetches the minimum set of
  # CGIAR-CSI 5°×5° SRTM tiles covering ``coverage_extent``, mosaics +
  # clips them with gdalwarp, and saves the result here. The intermediate
  # tile zips/tifs are deleted after the clip — final on-disk footprint is
  # just this clipped tif (~50 MB), not the multi-GB global product.
  #
  # No auth required. If CGIAR-CSI is unreachable the loader skips this
  # entry (logged warning) and the rest of the system still boots without
  # elevation; you can also drop a clipped tif at the target path manually
  # to bypass the downloader entirely.
  # ---------------------------------------------------------------------------
  - name: srtm_v1
    dataset_name: "SRTM Elevation (SE-US, 90m)"
    file: reference_rasters/srtm_v1.tif
    dataset_type: static
    temporal_resolution: static
    # Source SRTM is 90 m / 0.00083°, but we resample on download to ~1 km
    # (0.01°) — that's plenty for DSSAT's elevation uses (vapor pressure
    # adjustments, reference ET) and drops the SE-US clip from millions of
    # PostGIS rows to ~100, eliminating the memory pressure on map-tile
    # rendering and zonal-stats queries.
    spatial_resolution: "0.01deg"
    domain: elevation
    purpose: auto_elevation
    value_type: scalar
    units: meters
    band_meanings:
      1: elevation_m
    variables:
      elevation_m:
        display_name: "Elevation (m)"
        variable_type: numeric
        color_map:
          ramp: [[0, 0, 100, 0], [500, 200, 200, 100], [2000, 200, 100, 50], [4000, 255, 255, 255]]
          chart_color: "rgba(120,120,120,0.9)"
          label: "Elevation (m)"
    variable_display_names:
      elevation_m: "Elevation (m)"
    no_data_value: -32768
    coverage_extent:
      type: bbox
      # Union of dssat_soil_lookup_v1 and dssat_planting_date_lookup_v1
      # bboxes — keeps elevation valid wherever soil/planting in-situ work.
      min_lat: 24.82
      max_lat: 35.27
      min_lon: -88.52
      max_lon: -78.44
    # First-boot auto-download. Provider determines tile URL convention;
    # bbox + target_resolution_deg control the gdalwarp output.
    auto_download:
      provider: cgiar_csi_srtm_v4_1
      # Resample SRTM 90m → ~1 km on download. We don't need 90 m for
      # elevation in crop modeling (vapor pressure / reference ET use
      # elevation at single-digit-meter sensitivity). Resampling here
      # avoids materialising the 90 m raster locally at all.
      target_resolution_deg: 0.01
    ingest:
      # At ~1 km the SE-US clip is ~1000×1000 px. ``-t 100x100`` puts each
      # PostGIS row at ~100 km² (1°×1°), giving ~100 rows total — small
      # enough that ST_Union over the table is fast and bounded, but
      # granular enough that ST_Intersects skips most rows for any small
      # query envelope.
      tile_size: 100x100
    subroutines:
      reference_lookup:
        table_name: dataagent.srtm_v1
