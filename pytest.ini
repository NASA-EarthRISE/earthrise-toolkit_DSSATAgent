[pytest]
DJANGO_SETTINGS_MODULE = dssat_chat_project.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test discovery — every app's tests/ directory plus a root-level baseline suite.
testpaths =
    earthrise_agents_base/tests
    dssat_chat_agent/tests
    dssat_agent/tests
    data_agent/tests
    knowledge_agent/tests
    accounts/tests
    tests/integration

# Markers — allow selective test runs via `pytest -m <marker>`.
markers =
    integration: end-to-end tests that exercise the real chat state machine (with a mocked LLM)
    a2a_contract: A2A endpoint contract snapshots — the public JSON-RPC envelope must stay byte-identical
    chat_routing: verify canonical prompts route to the expected sub-agent
    live: hits real external services (Ollama, Postgres, Redis) — skipped in CI
    slow: long-running tests — skipped by default in CI

# Baseline runs should not need network/DB services. Enforce fast defaults.
addopts =
    --strict-markers
    -m "not live and not slow"
    -ra
